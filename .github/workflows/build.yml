name: Build Android APKs

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android 16 SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build both APKs
        run: gradle :app:assembleDebug :app-ai:assembleDebug --stacktrace

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk WA-AutoResponder-Offline-v1.2.apk
          cp app-ai/build/outputs/apk/debug/app-ai-debug.apk WA-AutoResponder-GeminiAI-v2.0.apk

      - name: Upload Offline APK
        uses: actions/upload-artifact@v4
        with:
          name: WA-AutoResponder-Offline-v1.2
          path: WA-AutoResponder-Offline-v1.2.apk
          if-no-files-found: error

      - name: Upload Gemini AI APK
        uses: actions/upload-artifact@v4
        with:
          name: WA-AutoResponder-GeminiAI-v2.0
          path: WA-AutoResponder-GeminiAI-v2.0.apk
          if-no-files-found: error
